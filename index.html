<!-- START: Ultra-Modern Social Media Section -->
<section id="social-media-section" class="social-section">
    <div class="social-container">
        <!-- Section Header -->
        <div class="social-header">
            <span class="social-subtitle-tag">CONNECT WITH ME</span>
            <h2>সোসাল মিডিয়ায় যুক্ত হোন</h2>
            <p>আমার অনলাইন প্রফাইলগুলো ভিজিট করুন এবং সরাসরি যোগাযোগ করুন।</p>
        </div>

        <!-- Social Cards Grid -->
        <div class="social-grid">
            
            <!-- Facebook Card -->
            <div class="social-card facebook-card" onclick="openSocialLink('facebook')">

                    </div>
                    <button class="social-btn">
                        <span>Visit Profile</span>
                        <i data-lucide="arrow-right" size="16"></i>
                    </button>
                </div>
            </div>

            <!-- TikTok Card -->
            <div class="social-card tiktok-card" onclick="openSocialLink('tiktok')">
                <div class="card-glow"></div>
                <div class="card-content">
                    <div class="icon-box">
                        <i data-lucide="video"></i>
                    </div>
                    <div class="card-info">
                        <h3>TikTok</h3>
                        <p>Follow Me on TikTok</p>
                    </div>
                    <button class="social-btn">
                        <span>Watch Videos</span>
                        <i data-lucide="arrow-right" size="16"></i>
                    </button>
                </div>
            </div>

            <!-- WhatsApp Card -->
            <div class="social-card whatsapp-card" onclick="openSocialLink('whatsapp')">
                <div class="card-glow"></div>
                <div class="card-content">
                    <div class="icon-box">
                        <i data-lucide="message-circle"></i>
                    </div>
                    <div class="card-info">
                        <h3>WhatsApp</h3>
                        <p>Let's Connect on WhatsApp</p>

                    <button class="social-btn">

            </div>

        </div>
    </div>
</section>

<!-- Lucide Icons CDN (if not already loaded) -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
    /* Social Media Section Styles */
    .social-section {
        padding: 90px 20px;
        position: relative;
        overflow: hidden;
        font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
    }

    .social-container {
        max-width: 1140px;
        margin: 0 auto;
    }

    .social-header {
        text-align: center;
        margin-bottom: 50px;
    }

    .social-subtitle-tag {
        color: #a855f7;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        display: inline-block;
        margin-bottom: 10px;
        padding: 6px 16px;
        background: rgba(168, 85, 247, 0.1);
        border: 1px solid rgba(168, 85, 247, 0.2);
        border-radius: 50px;
    }

    .social-header h2 {
        font-size: 2.2rem;
        font-weight: 800;
        color: #fff;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
    }

    .social-header p {
        color: #94a3b8;
        font-size: 1rem;
        max-width: 500px;
        margin: 0 auto;
    }

    /* Grid Layout */
    .social-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
    }

    /* Premium Card Design */
    .social-card {
        position: relative;
        background: linear-gradient(135deg, rgba(30, 27, 75, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
        border: 1px solid rgba(168, 85, 247, 0.2);
        border-radius: 24px;
        padding: 32px 24px;
        cursor: pointer;
        overflow: hidden;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Neon Purple Glow Effect behind cards */
    .card-glow {
        position: absolute;
        top: -50px;
        right: -50px;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(0,0,0,0) 70%);
        border-radius: 50%;
        opacity: 0.6;
        transition: opacity 0.3s ease;
        pointer-events: none;
    }

    .social-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: rgba(168, 85, 247, 0.6);
        box-shadow: 0 25px 50px -10px rgba(168, 85, 247, 0.25), 0 0 30px rgba(168, 85, 247, 0.2);
    }

    .social-card:hover .card-glow {
        opacity: 1;
    }

    .card-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        height: 100%;
    }

    /* Floating Icon Box */
    .icon-box {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        margin-bottom: 24px;
        box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.5);
        animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }

    .card-info h3 {
        font-size: 1.4rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 6px;
    }

    .card-info p {
        color: #94a3b8;
        font-size: 0.92rem;
        margin-bottom: 28px;
    }

    /* Action Button */
    .social-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
        padding: 10px 20px;
        border-radius: 50px;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: auto;
    }

    .social-card:hover .social-btn {
        background: #a855f7;
        color: #fff;
        border-color: #a855f7;
        box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        gap: 12px;
    }

    /* Responsive Design */
    @media (max-width: 992px) {
        .social-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 680px) {
        .social-grid {
            grid-template-columns: 1fr;
        }
        .social-section {
            padding: 60px 16px;
        }
        .social-header h2 {
            font-size: 1.8rem;
        }
    }
</style>

<script>
    // SINGLE CONFIGURATION SECTION FOR SOCIAL LINKS
    // সহজে এইখান থেকে লিংক পরিবর্তন করতে পারবেন
    const socialLinksConfig = {
        facebook: "https://www.facebook.com/yourprofile", // আপনার ফেসবুক প্রোফাইল লিংক দিন
        tiktok: "https://www.tiktok.com/@yourprofile",     // আপনার টিকটক প্রফাইল লিংক দিন
        whatsapp: "https://wa.me/8801700000000"             // আপনার হোয়াটসঅ্যাপ নম্বর বা লিংক দিন
    };

    // Function to handle safe external redirection
    function openSocialLink(platform) {
        const url = socialLinksConfig[platform];
        if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }
    }

    // Initialize Lucide Icons for this section
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
</script>
<!-- END: Ultra-Modern Social Media Section -->
